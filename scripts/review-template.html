<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨譯 · 真實漫畫覆核</title>
<style>body{margin:0;background:#f1eee6;color:#294333;font:15px "Microsoft JhengHei",sans-serif}header{padding:22px 30px;background:#fcfdf8;border-bottom:1px solid #ccd6ca}h1{font-size:23px;margin:0 0 9px}p{line-height:1.7}button,input,select,textarea{font:inherit;border:1px solid #b9caba;border-radius:5px;padding:9px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#284e3c;color:white}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}.bar input{width:160px}.summary{font-size:13px;color:#596f5c}main{display:grid;grid-template-columns:minmax(350px,1fr) 440px;gap:20px;padding:24px}.page{position:relative;align-self:start}.page img{width:100%;display:block}.box{position:absolute;border:2px solid #647f66;box-sizing:border-box;cursor:pointer}.box.active{border-color:#cb7e30}.box span{background:#32553e;color:white;padding:1px 4px;font-size:12px}.panel{background:#fcfdf8;padding:20px;border:1px solid #cbd4c7;border-radius:8px;align-self:start}label{display:block;margin:12px 0}label select,label textarea{display:block;width:100%;box-sizing:border-box;margin-top:7px}textarea{resize:vertical;min-height:74px}textarea[readonly]{background:#f2f4ee}canvas{max-width:100%;height:auto;background:white;border:1px solid #d4dbcd}.coords{display:flex;gap:8px}.coords label{width:24%}.coords input{box-sizing:border-box;width:100%}.check{display:flex;gap:8px;align-items:center}.grades{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font-size:12px;color:#61745d}#message{color:#a34c22}#picker{max-width:100%;width:100%}@media(max-width:900px){main{grid-template-columns:1fr}.panel{width:auto}}</style>
<header><h1>墨譯 · 真實漫畫逐框覆核</h1><div>Give My Regards to Black Jack / SHUHO SATO · <a href="https://densho810.com/free/" target="_blank">作者官方來源與利用規約</a></div><p class="small">模型候選原文、譯文與人工參考答案分開保存。請針對原始候選譯文評分；所有項目預設未覆核。</p>
<div class="bar"><label>PDF 頁碼 <select id="pages"></select></label><label>覆核者 <input id="reviewer" placeholder="姓名或暱稱"></label><button id="add">框出漏掉的文字</button><button class="primary" id="export">匯出覆核 JSON</button><label>載入進度 <input id="import" type="file" accept="application/json,.json"></label></div><div class="summary" id="summary"></div><div id="message" role="status"></div></header>
<main><div id="page" class="page"><img id="image" alt="原始漫畫頁"><div id="boxes"></div></div><section class="panel"><label class="check"><input id="pageComplete" type="checkbox">此頁文字框已完整覆核，漏框已補上</label><select id="picker"></select><p id="backend" class="small"></p><canvas id="crop"></canvas><p id="warnings" class="small"></p>
<label>區域分類<select id="category"><option value="unknown">未分類</option><option value="dialogue">一般對白</option><option value="difficult">困難對白</option><option value="other-text">標題、擬聲字或其他文字</option><option value="non-text">誤偵測／無文字</option></select></label>
<div class="coords"><label>X<input id="x" type="number"></label><label>Y<input id="y" type="number"></label><label>寬<input id="width" type="number"></label><label>高<input id="height" type="number"></label></div><label class="check"><input id="boxVerified" type="checkbox">已核對文字框範圍</label>
<label>候選日文原文<textarea id="source" readonly></textarea></label><button id="copySource">複製候選到參考原文</button><label>人工參考原文<textarea id="referenceSource"></textarea></label><label class="check"><input id="sourceVerified" type="checkbox">已逐字核對裁切圖與參考原文</label>
<label>原始候選譯文<textarea id="translation" readonly></textarea></label><label>人工修正譯文<textarea id="referenceTranslation"></textarea></label><div class="grades" id="grades"></div></section></main>
<script id="data" type="application/json">__DATA__</script><script>__REVIEW_MODEL__
const initial=JSON.parse(document.querySelector('#data').textContent),key='comic-review:'+initial.sourceManifestSha256;
let state=structuredClone(initial),pageIndex=0,selected='',drawing=false,start;
const $=id=>document.getElementById(id),criteria={meaning:'語意',address:'人物稱呼',tone:'語氣',traditional:'繁中與臺灣用語'};
for(const [name,title] of Object.entries(criteria)){const label=document.createElement('label');label.textContent='原譯文：'+title;const select=document.createElement('select');select.id=name;for(const [value,text] of [['unknown','未評分'],['pass','通過'],['fix','需修正']])select.add(new Option(text,value));select.onchange=()=>change(name,select.value);label.append(select);$('grades').append(label);}
const page=()=>state.pages[pageIndex],region=()=>page().regions.find(r=>r.id===selected);
function persist(){state.reviewer=$('reviewer').value;localStorage.setItem(key,JSON.stringify(state));const s=summarizeReview(state.pages,state.reviewer);$('summary').textContent=`逐字覆核 ${s.sourceVerified}/${s.referenceTexts} 個已分類文字框 · 一般對白已評 ${s.graded}/${s.generalDialogue} · 召回率 ${s.recallIoU05===null?'待完整標註':(s.recallIoU05*100).toFixed(1)+'%'} · OCR CER ${s.endToEndCER===null?'待覆核':(s.endToEndCER*100).toFixed(1)+'%'} · 原譯文通過率 ${s.translationAcceptance===null?'待評分':(s.translationAcceptance*100).toFixed(1)+'%'} · ${s.thresholdsMet?'已記錄評分達門檻':'正式驗收待完成'}`;}
function message(text){$('message').textContent=text;}
function change(name,value){const r=region();if(!r)return;r.review[name]=value;if(name==='referenceSource'){r.review.sourceVerified=false;$('sourceVerified').checked=false;}persist();if(name==='category')renderBoxes();}
function renderBoxes(){const boxes=$('boxes');boxes.replaceChildren();for(const [i,r] of page().regions.entries()){const box=document.createElement('div');box.className='box'+(r.id===selected?' active':'');box.style.cssText=`left:${r.x/page().width*100}%;top:${r.y/page().height*100}%;width:${r.width/page().width*100}%;height:${r.height/page().height*100}%`;const n=document.createElement('span');n.textContent=String(i+1);box.append(n);box.onclick=()=>{if(!drawing){selected=r.id;showRegion();renderBoxes();}};boxes.append(box);}}
function showRegion(){const r=region();$('picker').value=selected;for(const id of ['source','translation'])$(id).value=r?.[id]??'';for(const id of ['category','referenceSource','referenceTranslation',...Object.keys(criteria)])$(id).value=r?.review?.[id]??(id==='category'?'unknown':id in criteria?'unknown':'');for(const id of ['sourceVerified','boxVerified'])$(id).checked=Boolean(r?.review?.[id]);for(const id of ['x','y','width','height'])$(id).value=r?.[id]??0;$('warnings').textContent=r?.warnings?.join('；')??'';$('backend').textContent='實際翻譯後端：'+(page().translationBackend??'由原始執行紀錄查核');const c=$('crop'),ctx=c.getContext('2d');if(!r){c.width=1;c.height=1;return;}const b=r.ocrBox??r;c.width=Math.max(1,Math.ceil(b.width));c.height=Math.max(1,Math.ceil(b.height));if($('image').complete)ctx.drawImage($('image'),b.x,b.y,b.width,b.height,0,0,c.width,c.height);}
function showPage(){const p=page();$('image').src=p.file;$('image').onload=()=>showRegion();$('pageComplete').checked=Boolean(p.reviewComplete);$('picker').replaceChildren();for(const [i,r] of p.regions.entries())$('picker').add(new Option(`${i+1} · ${(r.source||'人工補框').slice(0,24)}`,r.id));selected=p.regions[0]?.id??'';showRegion();renderBoxes();persist();}
for(const p of state.pages)$('pages').add(new Option(String(p.pdfPage),String(p.pdfPage)));$('pages').onchange=()=>{pageIndex=state.pages.findIndex(p=>p.pdfPage===Number($('pages').value));showPage();};$('picker').onchange=()=>{selected=$('picker').value;showRegion();renderBoxes();};$('reviewer').oninput=persist;$('pageComplete').onchange=()=>{page().reviewComplete=$('pageComplete').checked;persist();};
for(const id of ['category','referenceSource','referenceTranslation','sourceVerified','boxVerified'])$(id).oninput=()=>{if(id==='sourceVerified'&&$('sourceVerified').checked&&!$('referenceSource').value.trim()){$('sourceVerified').checked=false;message('請先填入參考原文');return;}change(id,['sourceVerified','boxVerified'].includes(id)?$(id).checked:$(id).value);};
$('copySource').onclick=()=>{if(region()){$('referenceSource').value=region().source;change('referenceSource',region().source);$('sourceVerified').checked=false;}};
for(const id of ['x','y','width','height'])$(id).onchange=()=>{const r=region(),v=Number($(id).value);if(!r||!Number.isFinite(v))return;r[id]=v;r.x=Math.max(0,Math.min(page().width-1,r.x));r.y=Math.max(0,Math.min(page().height-1,r.y));r.width=Math.max(1,Math.min(page().width-r.x,r.width));r.height=Math.max(1,Math.min(page().height-r.y,r.height));r.review.boxVerified=false;delete r.ocrBox;showRegion();renderBoxes();persist();};
$('add').onclick=()=>{drawing=true;message('在左側原圖拖曳，框出漏掉的文字');};const point=e=>{const b=$('image').getBoundingClientRect();return{x:Math.max(0,Math.min(page().width,(e.clientX-b.x)/b.width*page().width)),y:Math.max(0,Math.min(page().height,(e.clientY-b.y)/b.height*page().height))};};$('page').onpointerdown=e=>{if(drawing){start=point(e);$('page').setPointerCapture(e.pointerId);e.preventDefault();}};$('page').onpointerup=e=>{if(!drawing||!start)return;const end=point(e),x=Math.min(start.x,end.x),y=Math.min(start.y,end.y),width=Math.abs(start.x-end.x),height=Math.abs(start.y-end.y);drawing=false;start=null;if(width<4||height<4)return;page().regions.push({id:'manual-'+crypto.randomUUID(),x,y,width,height,source:'',translation:'',predictionBox:null,warnings:['人工補框'],review:{category:'unknown',referenceSource:'',referenceTranslation:'',sourceVerified:false,boxVerified:false,meaning:'unknown',address:'unknown',tone:'unknown',traditional:'unknown'}});page().reviewComplete=false;showPage();selected=page().regions.at(-1).id;showRegion();renderBoxes();persist();message('已補框，請分類與填入參考原文');};
$('export').onclick=()=>{persist();if(!state.reviewer.trim()){message('請先填入覆核者');return;}const data={schema:'manga-quality-review/1',sourceManifestSha256:initial.sourceManifestSha256,credit:initial.credit,reviewer:state.reviewer,exportedAt:new Date().toISOString(),summary:summarizeReview(state.pages,state.reviewer),pages:state.pages};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='manga-quality-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message('覆核 JSON 已匯出；未評分項目仍保留待驗收');};
$('import').onchange=async()=>{try{const file=$('import').files[0];if(!file||file.size>5*1024*1024)throw Error('請選 5 MB 以內的覆核 JSON');const data=JSON.parse(await file.text());if(data.schema!=='manga-quality-review/1'||data.sourceManifestSha256!==initial.sourceManifestSha256||data.pages.length!==initial.pages.length)throw Error('來源版本不一致');for(const [i,p] of data.pages.entries()){const base=initial.pages[i];if(p.file!==base.file||p.sha256!==base.sha256||!Array.isArray(p.regions)||p.regions.length>200)throw Error('頁面身分不一致');const ids=new Set();for(const r of p.regions){if(ids.has(r.id)||![r.x,r.y,r.width,r.height].every(Number.isFinite)||r.x<0||r.y<0||r.width<=0||r.height<=0||r.x+r.width>p.width||r.y+r.height>p.height)throw Error('文字框格式錯誤');ids.add(r.id);const original=base.regions.find(v=>v.id===r.id);if(original){r.predictionBox=original.predictionBox;r.source=original.source;r.translation=original.translation;}else{if(!r.id.startsWith('manual-'))throw Error('區域身分錯誤');r.predictionBox=null;r.source='';r.translation='';}}}state={...initial,pages:data.pages,reviewer:String(data.reviewer??'').slice(0,100)};$('reviewer').value=state.reviewer;showPage();message('覆核進度已載入');}catch(error){message(String(error));}};
try{const saved=JSON.parse(localStorage.getItem(key));if(saved?.sourceManifestSha256===initial.sourceManifestSha256)state=saved;}catch{}$('reviewer').value=state.reviewer??'';showPage();
</script></html>
