<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>墨譯 · 匯入校正</title></head>
<body class="moyu">
  <main>
    <h1>匯入這張圖的校正</h1>
    <p>選擇這張漫畫先前匯出的 JSON，核對檔案與文字框後再匯入。</p>
    <label>校正 JSON <input id="file" type="file" accept="application/json,.json" disabled></label>
    <dl id="summary" hidden>
      <div><dt>選擇的檔案</dt><dd id="file-name"></dd></div>
      <div><dt>文字框</dt><dd id="region-count"></dd></div>
      <div><dt>取代範圍</dt><dd>目前這張圖的全部文字框、原文、譯文及排版設定。</dd></div>
    </dl>
    <footer class="confirmation">
      <p id="status" role="status">正在核對原工作台…</p>
      <button class="primary" id="submit" disabled>匯入到工作台</button>
    </footer>
  </main>
  <script type="module" src="./main.ts"></script>
  <style>
    body { margin: 0; background: var(--mx-canvas); }
    main { max-width: 595px; margin: clamp(12px,5vw,64px) auto; background: var(--mx-paper); border: 1px solid var(--mx-line); border-radius: 12px; padding: clamp(16px,4vw,28px); box-shadow: var(--mx-shadow); }
    h1 { margin: 0 0 10px; font-size: 24px; }
    label, input { display: block; max-width: 100%; }
    input { margin-top: 5px; }
    dl { background: var(--mx-tint); border: 1px solid var(--mx-line); padding: 12px; border-radius: 8px; }
    dt { font-size: 12px; color: var(--mx-muted); }
    dd { margin: 0 0 8px; overflow-wrap: anywhere; }
    .confirmation { position:sticky; bottom:0; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; background:var(--mx-paper); border-top:1px solid var(--mx-line); padding-top:8px; margin-top:12px; }
    .confirmation p { margin:0; overflow-wrap:anywhere; }
    @media(max-width:620px) { main { margin-inline: 10px; } }
  </style>
</body>
</html>
